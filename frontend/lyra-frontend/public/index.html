<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />

  <!-- Dynamic Favicon based on system theme -->
  <!-- Light mode (default) -->
  <link rel="icon" type="image/svg+xml" href="/Lyra_Logo.svg" media="(prefers-color-scheme: light)" />
  
  <!-- Dark mode -->
  <link rel="icon" type="image/svg+xml" href="/Lyra_Logo.svg" media="(prefers-color-scheme: dark)" />

  <!-- Fallback for browsers that don't support media queries -->
  <link rel="icon" type="image/svg+xml" href="/Lyra_Logo.svg" />

  <!-- Apple Touch Icon -->
  <link rel="apple-touch-icon" href="/Lyra_Logo.svg" />

  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lyra</title>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
